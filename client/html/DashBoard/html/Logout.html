<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <link rel="stylesheet" href="../css/LogoutStyle.css">
</head>
<body>
    <div class="container">
        <section class="UserDashboard">
            <h1>User Dashboard</h1>
            <button class="logout-btn">Logout</button>
        </section>

        <header>
            <h1>Team [Team Name]</h1>
        </header>

        <div class="logout-container">
            <div class="logout-content">
                <div class="logout-message">
                    Ready to leave the hackathon realm? Log out and save your progress.
                </div>
                <div class="button-container">
                    <button class="nope-btn">Nope</button>
                    <button class="sure-btn">Sure</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/logout.js"></script>
</body>
</html>
