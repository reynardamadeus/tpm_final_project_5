<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View CV</title>
    <link rel="stylesheet" href="../css/ViewCVStyle.css">
</head>
<body>
    <div class="background-asset"></div>
    <div class="background-asset-left"></div>
    <div class="container">
        <section class="UserDashboard">
            <h1>User Dashboard</h1>
            <button class="logout-btn">Logout</button>
        </section>

        <header>
            <h1>Team [Team Name]</h1>
        </header>

        <div class="view-cv-container">
            <div class="cv-content">
                <div class="cv-header">
                    <h2>View CV</h2>
                    <button class="back-btn">Back</button>
                </div>
                
                <div class="cv-image">
                    <img src="../asset/User Dashboard Page/CV(clear).svg" alt="CV Preview">
                </div>

                <button class="download-btn">Download ↓</button>
            </div>
        </div>
    </div>

    <script src="../js/viewCV.js"></script>
</body>
</html>
