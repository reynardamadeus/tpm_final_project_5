<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      @font-face {
        font-family: "PixelOperator";
        src: url("PixelOperator.ttf");
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- <img class="segi3-1" src="Login Page/segi3 dp 1.png"> -->
      <div class="header">TECHNOSCAPE</div>
      <div class="login-box">
        <div class="login-title">REGISTER</div>
          <div class="input-group">  <label for="teamName" class="team-name">Group Name</label>
            <input type="text" placeholder="Team Name" class="input-field" id="teamName">
        </div>
        <div class="input-group">  <label for="password" class="password-label">Password</label>
          <input type="password" placeholder="Password" class="input-field" id="password">
      </div>
      <div class="input-group"> 
        <label for="confirmPassword" class="password-label">Confirm Password</label> 
        <input type="password" placeholder="Password" class="input-field" id="confirmPassword"> 
    </div>
        <button class="login-button" onclick="register()">Next</button>
        <div class="register-link">
          <img
            src="Register Page/Group 3.png"
            alt="Register"
            class="register-image"
            id="registerImage"
          />
        </div>
      
    </div>

    <script>
      const registerImage = document.getElementById("registerImage");
      registerImage.addEventListener("click", () => {
        window.location.href = "index.html";
      });

      function register() {
        const groupName = document.getElementById("teamName").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        // Validasi input kosong
        if (!groupName || !password || !confirmPassword) {
          alert("Semua field harus diisi.");
          return;
        }

        // Validasi panjang password minimal 8 karakter
        if (password.length < 8) {
          alert("Password minimal 8 karakter.");
          return;
        }

        // Validasi kompleksitas password
        // const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        // if (!regex.test(password)) {
        //   alert("Password harus mengandung minimal 1 huruf besar, 1 huruf kecil, 1 angka, dan 1 karakter spesial.");
        //   return;
        // }

        // Validasi konfirmasi password
        if (password !== confirmPassword) {
          alert("Password and Confirm Password must be same.");
          return;
        }

        // alert("Registrasi berhasil!");
        window.location.href = "registration2.html";
      }
    </script>
  </body>
</html>
